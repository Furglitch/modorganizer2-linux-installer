name: Build Artifact

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "configs/**"
      - ".pre-commit-config.yaml"
      - ".python-version"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-artifact.yml"
      - ".github/actions/build-arm64/**"
      - "tests/verify_frozen_build.py"
  pull_request:
    paths:
      - "src/**"
      - "configs/**"
      - ".pre-commit-config.yaml"
      - ".python-version"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-artifact.yml"
      - ".github/actions/build-arm64/**"
      - "tests/verify_frozen_build.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git make wget curl unzip cabextract wine nodejs

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build Artifact
        run: |
          export WINEPREFIX=$HOME/.wine-py
          export WINEARCH=win64
          make _build

      - name: Upload MO2-LINT Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mo2-lint_artifact
          path: dist/mo2-lint

      - name: Upload NXM-HANDLER Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nxm-handler_artifact
          path: dist/nxm-handler

      - name: Upload REDIRECTOR Artifact
        uses: actions/upload-artifact@v7
        with:
          name: redirector_artifact
          path: dist/mo2-redirector.exe

  # ARM64 Linux (e.g. the Valve Steam Frame). The Windows redirector is reused
  # from the x86_64 job, which builds it with Wine.
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and verify ARM64 bundle
        uses: ./.github/actions/build-arm64

      - name: Upload MO2-LINT Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mo2-lint-aarch64_artifact
          path: dist/mo2-lint-aarch64
