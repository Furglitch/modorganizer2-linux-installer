name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        default: "7.X.X"

permissions:
  contents: write

concurrency:
  group: "build-release"
  cancel-in-progress: true

jobs:

  precheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing tag
        id: check_tag
        uses: actions/github-script@v9
        with:
          script: |
            const tag = '${{inputs.version}}';
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('exists', 'false');
                return;
              }
              throw error;
            }

      - name: Fail if tag exists
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "Error: Tag ${{inputs.version}} already exists."
          exit 1

      - name: Check version is bumped
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          check() {
            local file="$1"
            local actual="$2"
            [[ "$actual" == "$RELEASE_VERSION" ]] || {
              echo "Error: $file is $actual, expected $RELEASE_VERSION"
              exit 1
            }
          }

          check "pyproject.toml" "$(grep -E '^version = ".+"$' pyproject.toml | head -n 1 | cut -d '"' -f 2)"
          check "uv.lock" "$(awk '/name = "modorganizer2-linux-installer"/ { saw = 1 } saw && /version = "/ { gsub(/"/, "", $3); print $3; exit }' uv.lock)"
          check "src/mo2-lint/util/variables.py" "$(grep -E '^version: Final = ".+"$' src/mo2-lint/util/variables.py | head -n 1 | cut -d '"' -f 2)"

          grep -Fq -- "- \"$RELEASE_VERSION\"" .github/ISSUE_TEMPLATE/bug-installer.yml || {
            echo "Error: bug-installer.yml is missing $RELEASE_VERSION"
            exit 1
          }

          echo "Release version $RELEASE_VERSION is up to date."

  build:
    runs-on: ubuntu-latest
    needs: precheck
    container:
      image: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git make wget curl unzip cabextract wine nodejs

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build Release
        run: |
          export WINEPREFIX=$HOME/.wine-py
          export WINEARCH=win64
          make _build

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mo2-lint_artifact
          path: dist/mo2-lint
          if-no-files-found: error

      - name: Upload REDIRECTOR Artifact
        uses: actions/upload-artifact@v7
        with:
          name: redirector_artifact
          path: dist/mo2-redirector.exe
          if-no-files-found: error

  # ARM64 Linux (e.g. the Valve Steam Frame). The Windows redirector is reused
  # from the x86_64 job, which builds it with Wine.
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and verify ARM64 bundle
        uses: ./.github/actions/build-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mo2-lint-aarch64_artifact
          path: dist/mo2-lint-aarch64
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build, build-aarch64]
    steps:
      - name: Create Release Tag
        id: create_tag
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{inputs.version}}',
              sha: context.sha
            })

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: mo2-lint_artifact
          path: /tmp/artifact

      - name: Download ARM64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: mo2-lint-aarch64_artifact
          path: /tmp/artifact

      - name: Create Release
        id: release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{inputs.version}}
          token: ${{secrets.GITHUB_TOKEN}}
          artifacts: /tmp/artifact/**
          name: "MO2-LINT ${{inputs.version}}"
