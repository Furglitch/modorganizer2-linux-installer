[project]
name = "modorganizer2-linux-installer"
version = "7.0.0-rc7"
description = "An easy-to-use Mod Organizer 2 installer for Linux"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.7.22",
    "click>=8.4.2",
    "dotenv>=0.9.9",
    "inquirerpy>=0.3.4",
    "loguru>=0.7.3",
    "patool>=4.0.5",
    "pre-commit>=4.6.1",
    "protontricks>=1.14.1",
    "psutil>=7.1.3",
    "pydantic>=2.13.4",
    "pyinstaller>=6.22.0",
    "pyinstaller-hooks-contrib>=2026.6",
    "pyyaml>=6.0.3",
    "ruff==0.16.1",
    "requests>=2.34.2",
    "send2trash>=2.0.0",
    "websockets>=17.0.1",
]

[tool.ruff.lint]
ignore = [
    "BLE001",
    "PLW0602",
    "S110",
    "S112",
]

[tool.ruff.lint.per-file-ignores]
"src/mo2-lint/__init__.py" = ["F401", "N999"]
"src/nxm-handler/__init__.py" = ["F401", "N999"]
